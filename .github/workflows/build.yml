name: Build apps

# Builds the Android APK and the Windows app.
# - Every push to main: download them from the run's "Artifacts".
# - Push a tag like v1.0.0: they are also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Same signing key on every build, so a new APK installs over the old one.
      # Add the repository secret ANDROID_KEYSTORE_BASE64 (see README). The other
      # three secrets are optional and default to the values shown.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a temporary key and won't update an installed copy."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/upload.jks
          P="${KS_PASS:-android}"; A="${KEY_ALIAS:-androiddebugkey}"; KP="${KEY_PASS:-$P}"
          # java.util.Properties treats backslashes as escapes
          {
            echo "storeFile=upload.jks"
            echo "storePassword=${P//\\/\\\\}"
            echo "keyAlias=${A//\\/\\\\}"
            echo "keyPassword=${KP//\\/\\\\}"
          } > android/key.properties
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk TuitMate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TuitMate-android
          path: TuitMate.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TuitMate.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TuitMate-windows-portable.zip
      - name: Build installer
        shell: pwsh
        continue-on-error: true
        run: |
          function Find-Iscc {
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Find-Iscc }
          & $iscc.FullName "/O$($PWD.Path)" windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TuitMate-windows
          path: |
            TuitMate-windows-portable.zip
            TuitMate-Setup.exe
          if-no-files-found: warn
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TuitMate-windows-portable.zip
            TuitMate-Setup.exe
          fail_on_unmatched_files: false
